<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="1180" height="610">
  <defs>
    <!-- Accent gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="y1" values="0%;50%;0%" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- ASCII gradient -->
    <linearGradient id="asciiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#06B6D4"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;0%;100%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Background glows - subtle for light mode -->
    <radialGradient id="glowBlue" cx="20%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
      <animate attributeName="cx" values="20%;30%;20%" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="30%;50%;30%" dur="12s" repeatCount="indefinite"/>
    </radialGradient>

    <radialGradient id="glowPurple" cx="70%" cy="60%" r="35%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
      <animate attributeName="cx" values="70%;60%;70%" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="60%;40%;60%" dur="11s" repeatCount="indefinite"/>
    </radialGradient>

    <radialGradient id="glowEmerald" cx="50%" cy="80%" r="30%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
      <animate attributeName="cx" values="50%;40%;50%" dur="9s" repeatCount="indefinite"/>
    </radialGradient>

    <!-- Border gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(15,23,42,0.06)"/>
      <stop offset="50%" stop-color="rgba(37,99,235,0.2)"/>
      <stop offset="100%" stop-color="rgba(15,23,42,0.06)"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;200%;100%" dur="4s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Panel border gradient -->
    <linearGradient id="panelBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(15,23,42,0.04)"/>
      <stop offset="50%" stop-color="rgba(6,182,212,0.15)"/>
      <stop offset="100%" stop-color="rgba(15,23,42,0.04)"/>
      <animate attributeName="x1" values="-100%;100%;-100%" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%;0%" dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Glow filter - softer for light -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Scanline filter -->
    <pattern id="scanlines" patternUnits="userSpaceOnUse" width="1180" height="4">
      <rect width="1180" height="2" fill="rgba(15,23,42,0.01)"/>
      <rect y="2" width="1180" height="2" fill="transparent"/>
    </pattern>

    <!-- Noise pattern -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="mono"/>
      <feBlend in="SourceGraphic" in2="mono" mode="overlay" result="blend"/>
      <feComponentTransfer in="blend">
        <feFuncA type="linear" slope="0.02"/>
      </feComponentTransfer>
    </filter>

    <!-- Shadow filter -->
    <filter id="softShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="rgba(15,23,42,0.08)"/>
    </filter>

    <!-- Pill gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <!-- Main background -->
  <rect width="1180" height="610" rx="16" fill="#FFFFFF"/>

  <!-- Background glows -->
  <rect width="1180" height="610" rx="16" fill="url(#glowBlue)"/>
  <rect width="1180" height="610" rx="16" fill="url(#glowPurple)"/>
  <rect width="1180" height="610" rx="16" fill="url(#glowEmerald)"/>

  <!-- Scanline overlay -->
  <rect width="1180" height="610" rx="16" fill="url(#scanlines)" opacity="0.4">
    <animate attributeName="y" values="0;4;0" dur="0.1s" repeatCount="indefinite"/>
  </rect>

  <!-- Outer border shimmer -->
  <rect x="0.5" y="0.5" width="1179" height="609" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="1"/>

  <!-- Floating particles -->
  <circle cx="100" cy="100" r="1.5" fill="#2563EB" opacity="0.25">
    <animate attributeName="cy" values="100;80;100" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.25;0.5;0.25" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="500" r="1" fill="#7C3AED" opacity="0.2">
    <animate attributeName="cy" values="500;470;500" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.4;0.2" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="900" cy="150" r="1.5" fill="#10B981" opacity="0.2">
    <animate attributeName="cy" values="150;130;150" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.4;0.2" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1050" cy="450" r="1" fill="#06B6D4" opacity="0.2">
    <animate attributeName="cy" values="450;430;450" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.4;0.2" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="80" r="1" fill="#2563EB" opacity="0.15">
    <animate attributeName="cy" values="80;60;80" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.15;0.3;0.15" dur="11s" repeatCount="indefinite"/>
  </circle>

  <!-- ==================== LEFT PANEL - SP MONOGRAM ==================== -->
  <g>
    <!-- Left panel background -->
    <rect x="24" y="24" width="420" height="562" rx="12" fill="#F8FAFC" filter="url(#softShadow)"/>
    <rect x="24" y="24" width="420" height="562" rx="12" fill="none" stroke="url(#panelBorder)" stroke-width="0.5"/>

    <!-- Glow behind text -->
    <circle cx="234" cy="310" r="160" fill="url(#asciiGrad)" opacity="0.04">
      <animate attributeName="opacity" values="0.04;0.08;0.04" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="r" values="160;170;160" dur="4s" repeatCount="indefinite"/>
    </circle>

    <!-- SP letters -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.3s" fill="freeze"/>

      <text x="234" y="330" text-anchor="middle" font-family="'SF Pro Display', 'Inter', -apple-system, sans-serif" font-size="160" font-weight="bold" fill="url(#accentGrad)" filter="url(#glow)">SP</text>
    </g>

    <!-- Soham Pawar name below -->
    <text x="234" y="380" text-anchor="middle" font-family="monospace" font-size="14" fill="#475569" opacity="0" letter-spacing="3">
      <animate attributeName="opacity" from="0" to="0.8" dur="0.6s" begin="1.2s" fill="freeze"/>
      Soham Pawar
    </text>

    <!-- Scanline sweep on left panel -->
    <rect x="24" y="24" width="420" height="3" rx="1" fill="rgba(37,99,235,0.04)" opacity="0.6">
      <animate attributeName="y" values="24;586;24" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ==================== RIGHT PANEL - TERMINAL ==================== -->
  <g>
    <!-- Right panel background -->
    <rect x="468" y="24" width="688" height="562" rx="12" fill="#F8FAFC" filter="url(#softShadow)"/>
    <rect x="468" y="24" width="688" height="562" rx="12" fill="none" stroke="url(#panelBorder)" stroke-width="0.5"/>

    <!-- Terminal window chrome -->
    <circle cx="496" cy="50" r="5" fill="#EF4444" opacity="0.7"/>
    <circle cx="514" cy="50" r="5" fill="#F59E0B" opacity="0.7"/>
    <circle cx="532" cy="50" r="5" fill="#10B981" opacity="0.7"/>
    <text x="812" y="54" text-anchor="middle" font-family="monospace" font-size="11" fill="#475569" opacity="0.5">~/soham-pawar</text>

    <!-- Divider line -->
    <line x1="480" y1="68" x2="1144" y2="68" stroke="rgba(15,23,42,0.06)" stroke-width="0.5"/>

    <!-- Greeting -->
    <text x="500" y="105" font-family="monospace" font-size="22" fill="#0F172A" font-weight="bold" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.0s" fill="freeze"/>
      Hi, I'm Soham Pawar
    </text>

    <!-- Animated typing roles - discrete switching to prevent overlap -->
    <g font-family="monospace" font-size="16" fill="url(#accentGrad)" filter="url(#glow)">
      <text x="500" y="140" opacity="0">
        <animate attributeName="opacity" calcMode="discrete" values="1;0;0;0" keyTimes="0;0.25;0.5;0.75" dur="12s" begin="2s" repeatCount="indefinite"/>
        &gt; Full Stack Developer
      </text>
      <text x="500" y="140" opacity="0">
        <animate attributeName="opacity" calcMode="discrete" values="0;1;0;0" keyTimes="0;0.25;0.5;0.75" dur="12s" begin="2s" repeatCount="indefinite"/>
        &gt; Indie App Builder
      </text>
      <text x="500" y="140" opacity="0">
        <animate attributeName="opacity" calcMode="discrete" values="0;0;1;0" keyTimes="0;0.25;0.5;0.75" dur="12s" begin="2s" repeatCount="indefinite"/>
        &gt; FinTech Developer
      </text>
      <text x="500" y="140" opacity="0">
        <animate attributeName="opacity" calcMode="discrete" values="0;0;0;1" keyTimes="0;0.25;0.5;0.75" dur="12s" begin="2s" repeatCount="indefinite"/>
        &gt; Open Source Contributor
      </text>
    </g>

    <!-- Typing cursor for roles -->
    <rect x="720" y="127" width="2" height="16" fill="url(#accentGrad)">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>

    <!-- Info section - sequential reveal -->
    <g font-family="monospace" font-size="13">
      <text x="500" y="185" fill="#475569" opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="3.0s" fill="freeze"/>
        <tspan fill="#2563EB">&#9656;</tspan> Location    <tspan fill="#0F172A">India (IIIT Nagpur)</tspan>
      </text>
      <text x="500" y="210" fill="#475569" opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="3.4s" fill="freeze"/>
        <tspan fill="#2563EB">&#9656;</tspan> Education   <tspan fill="#0F172A">ECE @ IIIT Nagpur</tspan>
      </text>
      <text x="500" y="235" fill="#475569" opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="3.8s" fill="freeze"/>
        <tspan fill="#2563EB">&#9656;</tspan> Focus       <tspan fill="#0F172A">Indie apps &amp; Vibe Launch</tspan>
      </text>
      <text x="500" y="260" fill="#475569" opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="4.2s" fill="freeze"/>
        <tspan fill="#2563EB">&#9656;</tspan> Role        <tspan fill="#0F172A">Co-Lead, CRISPR Club</tspan>
      </text>
      <text x="500" y="285" fill="#475569" opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="4.6s" fill="freeze"/>
        <tspan fill="#2563EB">&#9656;</tspan> GitHub      <tspan fill="#0F172A">sohampawar1866</tspan>
      </text>
    </g>

    <!-- Skills section label -->
    <text x="500" y="330" font-family="monospace" font-size="12" fill="#475569" opacity="0">
      <animate attributeName="opacity" from="0" to="0.7" dur="0.4s" begin="5.0s" fill="freeze"/>
      // skills
    </text>

    <!-- Skill pills - Row 1 -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="5.4s" fill="freeze"/>

      <!-- Flutter -->
      <rect x="500" y="345" width="72" height="28" rx="14" fill="url(#pillGrad)" stroke="rgba(37,99,235,0.2)" stroke-width="0.5"/>
      <text x="536" y="364" text-anchor="middle" font-family="monospace" font-size="11" fill="#1E293B">Flutter</text>

      <!-- React -->
      <rect x="582" y="345" width="64" height="28" rx="14" fill="url(#pillGrad)" stroke="rgba(37,99,235,0.2)" stroke-width="0.5"/>
      <text x="614" y="364" text-anchor="middle" font-family="monospace" font-size="11" fill="#1E293B">React</text>

      <!-- TypeScript -->
      <rect x="656" y="345" width="96" height="28" rx="14" fill="url(#pillGrad)" stroke="rgba(37,99,235,0.2)" stroke-width="0.5"/>
      <text x="704" y="364" text-anchor="middle" font-family="monospace" font-size="11" fill="#1E293B">TypeScript</text>

      <!-- Node.js -->
      <rect x="762" y="345" width="74" height="28" rx="14" fill="url(#pillGrad)" stroke="rgba(37,99,235,0.2)" stroke-width="0.5"/>
      <text x="799" y="364" text-anchor="middle" font-family="monospace" font-size="11" fill="#1E293B">Node.js</text>

      <!-- Swift -->
      <rect x="846" y="345" width="62" height="28" rx="14" fill="url(#pillGrad)" stroke="rgba(37,99,235,0.2)" stroke-width="0.5"/>
      <text x="877" y="364" text-anchor="middle" font-family="monospace" font-size="11" fill="#1E293B">Swift</text>

      <!-- Python -->
      <rect x="918" y="345" width="72" height="28" rx="14" fill="url(#pillGrad)" stroke="rgba(37,99,235,0.2)" stroke-width="0.5"/>
      <text x="954" y="364" text-anchor="middle" font-family="monospace" font-size="11" fill="#1E293B">Python</text>
    </g>

    <!-- Skill pills - Row 2 -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="5.8s" fill="freeze"/>

      <!-- Webhooks -->
      <rect x="500" y="383" width="82" height="28" rx="14" fill="url(#pillGrad)" stroke="rgba(6,182,212,0.2)" stroke-width="0.5"/>
      <text x="541" y="402" text-anchor="middle" font-family="monospace" font-size="11" fill="#1E293B">Webhooks</text>

      <!-- Docker -->
      <rect x="592" y="383" width="72" height="28" rx="14" fill="url(#pillGrad)" stroke="rgba(6,182,212,0.2)" stroke-width="0.5"/>
      <text x="628" y="402" text-anchor="middle" font-family="monospace" font-size="11" fill="#1E293B">Docker</text>

      <!-- PostgreSQL -->
      <rect x="674" y="383" width="96" height="28" rx="14" fill="url(#pillGrad)" stroke="rgba(6,182,212,0.2)" stroke-width="0.5"/>
      <text x="722" y="402" text-anchor="middle" font-family="monospace" font-size="11" fill="#1E293B">PostgreSQL</text>

      <!-- Supabase -->
      <rect x="780" y="383" width="86" height="28" rx="14" fill="url(#pillGrad)" stroke="rgba(6,182,212,0.2)" stroke-width="0.5"/>
      <text x="823" y="402" text-anchor="middle" font-family="monospace" font-size="11" fill="#1E293B">Supabase</text>

      <!-- Appwrite -->
      <rect x="876" y="383" width="86" height="28" rx="14" fill="url(#pillGrad)" stroke="rgba(6,182,212,0.2)" stroke-width="0.5"/>
      <text x="919" y="402" text-anchor="middle" font-family="monospace" font-size="11" fill="#1E293B">Appwrite</text>
    </g>

    <!-- Projects section -->
    <text x="500" y="445" font-family="monospace" font-size="12" fill="#475569" opacity="0">
      <animate attributeName="opacity" from="0" to="0.7" dur="0.4s" begin="6.2s" fill="freeze"/>
      // shipped
    </text>

    <g font-family="monospace" font-size="12" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="6.6s" fill="freeze"/>
      <text x="500" y="470" fill="#0F172A"><tspan fill="#10B981">&#9733;</tspan> remote-claude <tspan fill="#475569">- CLI + PWA to control Claude Code from phone</tspan></text>
      <text x="500" y="492" fill="#0F172A"><tspan fill="#10B981">&#9733;</tspan> Stripe UPI Recurring <tspan fill="#475569">- UPI e-mandate payments reference impl</tspan></text>
      <text x="500" y="514" fill="#0F172A"><tspan fill="#10B981">&#9733;</tspan> IIITN Smart <tspan fill="#475569">- Campus app with crypto QR payments</tspan></text>
      <text x="500" y="536" fill="#0F172A"><tspan fill="#10B981">&#9733;</tspan> SafetyBeacon <tspan fill="#475569">- Real-time alerts for conflict zones</tspan></text>
      <text x="500" y="558" fill="#0F172A"><tspan fill="#10B981">&#9733;</tspan> Project Sentinel <tspan fill="#475569">- AI ocean protection system</tspan></text>
      <text x="500" y="580" fill="#0F172A"><tspan fill="#10B981">&#9733;</tspan> Vibe Launch <tspan fill="#475569">- Multi-agent post-launch marketing</tspan></text>
    </g>

    <!-- Scanline sweep on right panel -->
    <rect x="468" y="24" width="688" height="2" rx="1" fill="rgba(37,99,235,0.03)" opacity="0.5">
      <animate attributeName="y" values="24;586;24" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Glass reflection overlay -->
  <rect x="0" y="0" width="1180" height="305" rx="16" fill="url(#glowBlue)" opacity="0.02">
    <animate attributeName="opacity" values="0.02;0.04;0.02" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>